# Apre il Cruscotto ogni 6 ore perché Streamlit Community Cloud non lo metta in pausa
# (dopo ~12 ore senza visite la riapertura è molto lenta).
# Configurazione: Settings → Secrets and variables → Actions → New repository secret
#   Nome: CRUSCOTTO_URL   Valore: l'indirizzo dell'app, es. https://nome-app.streamlit.app
name: Sveglia Cruscotto

on:
  schedule:
    - cron: "17 */6 * * *"   # ogni 6 ore (orario UTC), al minuto 17
  workflow_dispatch: {}       # avvio manuale dalla scheda Actions

permissions:
  contents: read

jobs:
  sveglia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il browser
        run: |
          pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Apri l'app
        env:
          CRUSCOTTO_URL: ${{ secrets.CRUSCOTTO_URL }}
        run: python .github/scripts/sveglia_streamlit.py "$CRUSCOTTO_URL"
